[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cricket-mcp"
version = "0.1.0"
description = "MCP server for cricket: calibrated win model, 22k-match ball-by-ball archive, live scores and market prices"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Apoorv Saraogee" }]
keywords = ["mcp", "model-context-protocol", "cricket", "sports", "analytics"]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/asaraog/cricket-mcp"

[project.scripts]
cricket-mcp = "cricket_mcp:main"

[tool.setuptools]
# The wheel carries a compiled binary, so it is platform-specific; the
# release workflow stamps the right tag per platform.
packages = ["cricket_mcp"]
include-package-data = true

[tool.setuptools.package-data]
cricket_mcp = ["bin/*"]
